name: forma
description: "Forma — a standalone strength training tracker. All data stays on device."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.1.0+7

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  path_provider: ^2.0.15
  share_plus: ^12.0.2
  # Document-only picker (UIDocumentPicker on iOS) — unlike file_picker it
  # doesn't link the Photos framework, so no photo-library permission is needed.
  file_selector: ^1.0.3
  csv: ^6.0.0
  liquid_glass_widgets: ^0.18.4
  # Plays the rest-timer completion chime; SystemSound.alert is a no-op in-app
  # on iOS, so a real audio player is the only way to get an audible cue.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Used by the store tests to point path_provider at a scratch directory.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8


flutter:
  uses-material-design: true
  assets:
    - lib/assets/icon/
    - lib/assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "lib/assets/icon/app_icon.png"
